<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="ec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Base escura com cantos chanfrados (estilo pixel) -->
  <path fill="#0d0614" d="M2 0h28v1h1v1h1v12h-1v1h-1v1H2v-1H1v-1H0V2h1V1h1V0z" />
  
  <!-- Borda interna sutil -->
  <path fill="#1d0c30" d="M2 1h28v1h1v12h-1v1H2v-1H1V2h1V1zm0 1v12h28V2H2z" />

  <!-- Sombra projetada das letras (efeito 3D pixelado) - deslocada 1px down-right -->
  <path fill="#2a0440" d="M5 4h6v1H6v2h3v1H6v2h4v1H4V4zm7 0h5v1h-4v5h4v1h-5V4z" transform="translate(1, 1)" />

  <!-- Iniciais "EC" com gradiente synthwave -->
  <path fill="url(#ec-grad)" d="
    M4 3h6v1H5v2h3v1H5v2h4v1H3V3z
    M10 3h5v1h-4v5h4v1H10V3z
  " />

  <!-- Highlights nos cantos superiores -->
  <rect x="4" y="3" width="1" height="1" fill="#ffffff" fill-opacity="0.7" />
  <rect x="10" y="3" width="1" height="1" fill="#ffffff" fill-opacity="0.7" />
  
  <!-- Definição do gradiente -->
  <defs>
    <linearGradient id="ec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
</svg>